---
name: ci

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a GitHub Release for; skips the bump
        required: false
        type: string
      bump:
        description: Force the bump level (auto = derive from commits). Ignored when tag is set.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      notes:
        description: "Release notes body (default: GitHub auto-generated notes)"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
    permissions:
      contents: read
      packages: read
      statuses: write

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
      - run: mise run test

  # The single required status check, and all that release waits on.
  ci-gate:
    if: always()
    needs: [hk, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: ci-gate
    if: github.event_name != 'pull_request'
    uses: hugoh/gh-workflows/.github/workflows/release.yml@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || '' }}
      bump: ${{ inputs.bump || 'auto' }}
      notes: ${{ inputs.notes || '' }}
      package-command: luarocks new_version hs-mock-scm-1.rockspec "$VERSION" --tag="$TAG"
      package-artifacts: hs-mock-[0-9]*-1.rockspec

  # Publishes to luarocks.org once a LUAROCKS_API_KEY secret is set; skipped until then.
  luarocks:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
      - name: Upload to luarocks.org
        env:
          TAG: ${{ needs.release.outputs.tag }}
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$LUAROCKS_API_KEY" ]; then
            echo "::notice::LUAROCKS_API_KEY is not set; skipping luarocks.org upload"
            exit 0
          fi
          version="${TAG#v}"
          luarocks new_version hs-mock-scm-1.rockspec "$version" --tag="$TAG"
          luarocks upload "hs-mock-$version-1.rockspec" --api-key="$LUAROCKS_API_KEY"

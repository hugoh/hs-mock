[tools]
hk = "2.5.0"
lua = "5.4"
"aqua:Kampfkarren/selene" = "0.32.0"
stylua = "2.5.2"
"aqua:LuaLS/lua-language-server" = "3.19.1"
"aqua:jgm/pandoc" = "3.12.1"
uv = "0.12.23"
actionlint = "1.7.12"
pinact = "4.1.1"
zizmor = "1.30.1"
ghalint = "1.5.6"
gitleaks = "8.30.1"
typos = "1.50.3"
rumdl = "0.2.78"
biome = "2.5.10"
tombi = "1.7.1"
"github:owenlamont/ryl" = "0.22.0"

[tasks.test]
depends = ["test:*"]
description = "Run all test suites"

[tasks."test:lua"]
run = "busted"
description = "Run the hs_mock busted specs"

[tasks."test:rock"]
description = "Build the hs-mock rock into a scratch tree and require it from there only"
run = """
set -e
tree="$(mktemp -d)"
trap 'rm -rf "$tree"' EXIT
luarocks make --tree "$tree" hs-mock-scm-1.rockspec >/dev/null
lua -e "package.path = '$tree/share/lua/5.4/?.lua'; require('hs_mock').new()"
echo "hs-mock rock OK"
"""

[tasks.docs]
description = "Build the API reference page into docs/ from the LuaLS annotations"
run = """
set -e
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
lua-language-server --doc="$PWD/lua" --doc_out_path="$work" --logpath="$work/log" >/dev/null
lua scripts/api-md.lua "$work/doc.md" "$work/api.md"
mkdir -p docs
cp scripts/docs.css docs/docs.css
pandoc "$work/api.md" --standalone --toc --toc-depth=1 --syntax-highlighting=breezedark \\
  --css=https://cdn.jsdelivr.net/npm/@anyblades/blades@3/css/blades.min.css \\
  --css=docs.css \\
  --metadata title="hs-mock API" \\
  --metadata description="Mock of the Hammerspoon hs global for testing Spoons under busted" \\
  -o docs/index.html
sed -i.bak 's|<h1 class="title">hs-mock API</h1>|&<p class="repo-link"><a href="https://github.com/hugoh/hs-mock">GitHub repository</a></p>|' docs/index.html
rm docs/index.html.bak
echo "docs/index.html"
"""

[tasks.vendor]
description = "Refresh the vendored hs.fnutils and hs.inspect from a Hammerspoon release tag"
usage = 'arg "<tag>" help="Hammerspoon release tag, e.g. 1.1.1"'
run = """
set -e
tag="$usage_tag"
for module in fnutils inspect; do
  {
    echo "-- Vendored unchanged from Hammerspoon $tag extensions/$module/$module.lua (refresh: mise run vendor <tag>)."
    if [ "$module" = inspect ]; then
      echo "-- MIT License, Copyright (c) 2013 Enrique García Cota (https://github.com/kikito/inspect.lua)."
    else
      echo "-- MIT License, Copyright (c) 2014-2025 Various Contributors (https://github.com/Hammerspoon/hammerspoon)."
    fi
    echo
    curl -fsSL "https://raw.githubusercontent.com/Hammerspoon/hammerspoon/$tag/extensions/$module/$module.lua"
  } > "lua/hs_mock/$module.lua.new"
  mv "lua/hs_mock/$module.lua.new" "lua/hs_mock/$module.lua"
done
"""

[hooks]
postinstall = ["luarocks install busted"]
